[package]
name = "koharu"
version = "0.1.0"
edition = "2021"
authors = ["koharu contributors"]
description = "A high-performance reverse proxy and load balancer"
license = "MIT"
repository = "https://github.com/mayocream/koharu"
readme = "README.md"
keywords = ["proxy", "load-balancer", "http", "networking"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "koharu"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client and server
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS support
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
bytes = "1"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

[dev-dependencies]
tokio-test = "0.4"
httptest = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Faster incremental builds during development
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Personal dev override: speed up rebuilds on my machine by splitting into more units
[profile.dev.package."*"]
opt-level = 1

# Personal override: use thin LTO in release for faster link times while still
# getting most of the optimization benefit
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4
